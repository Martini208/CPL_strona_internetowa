<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sezony</title>
  
  <!-- Füge hier den Namen deiner CSS-Datei ein -->
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    /* Spezifische Stile für die ausfahrbaren Saison-Boxen */
    .season-card {
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
    }

    .season-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .season-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out, padding 0.3s ease;
      padding: 0 20px;
    }

    .season-card.open .season-content {
      max-height: 1200px;
      padding: 20px;
    }

    .season-card.open .arrow-icon {
      transform: rotate(180deg);
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Deine Navigation -->
  <nav>
    <ul>
      <li><a href="kalendarz.html">Kalendarz</a></li>
      <li><a href="sezony.html" class="active">Sezony</a></li>
    </ul>
  </nav>

  <main class="container">
    <h1>Sezony</h1>

    <!-- Excel Upload -->
    <div class="upload-section" style="margin-bottom: 20px;">
      <label for="excelFileInput"><strong>Załaduj plik Excel (.xlsx):</strong></label>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" />
    </div>

    <!-- Saisons Container -->
    <div id="seasonsContainer"></div>
  </main>

  <script>
    let seasonsData = [
      {
        name: "Sezon 2025",
        fahrer: [
          { pos: 1, name: "Max Verstappen", team: "Red Bull", punkte: 410 },
          { pos: 2, name: "Lando Norris", team: "McLaren", punkte: 340 }
        ],
        rennen: [
          { nr: 1, grandPrix: "GP Bahrajnu", sieger: "Max Verstappen", pole: "Max Verstappen" }
        ],
        teams: [
          { pos: 1, team: "Red Bull Racing", punkte: 560 },
          { pos: 2, team: "McLaren", punkte: 520 }
        ]
      }
    ];

    function renderSeasons(data) {
      const container = document.getElementById('seasonsContainer');
      container.innerHTML = '';

      data.forEach((season, index) => {
        const card = document.createElement('div');
        card.className = 'season-card';

        card.innerHTML = `
          <div class="season-header" onclick="toggleSeason(this)">
            <h2>${season.name}</h2>
            <span class="arrow-icon">▼</span>
          </div>
          <div class="season-content">
            <div class="tab-buttons">
              <button class="tab-btn active" onclick="switchTab(event, 'fahrer-${index}')">Kierowcy</button>
              <button class="tab-btn" onclick="switchTab(event, 'rennen-${index}')">Wyścigi</button>
              <button class="tab-btn" onclick="switchTab(event, 'teams-${index}')">Zespoły</button>
            </div>

            <div id="fahrer-${index}" class="tab-content active">
              <table>
                <thead>
                  <tr><th>Poz</th><th>Kierowca</th><th>Zespół</th><th>Punkty</th></tr>
                </thead>
                <tbody>
                  ${season.fahrer.map(f => `
                    <tr>
                      <td>${f.pos}</td>
                      <td>${f.name}</td>
                      <td>${f.team}</td>
                      <td><strong>${f.punkte}</strong></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div id="rennen-${index}" class="tab-content">
              <table>
                <thead>
                  <tr><th>#</th><th>Grand Prix</th><th>Zwycięzca</th><th>Pole Position</th></tr>
                </thead>
                <tbody>
                  ${season.rennen.map(r => `
                    <tr>
                      <td>${r.nr}</td>
                      <td>${r.grandPrix}</td>
                      <td>${r.sieger}</td>
                      <td>${r.pole}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div id="teams-${index}" class="tab-content">
              <table>
                <thead>
                  <tr><th>Poz</th><th>Zespół</th><th>Punkty</th></tr>
                </thead>
                <tbody>
                  ${season.teams.map(t => `
                    <tr>
                      <td>${t.pos}</td>
                      <td>${t.team}</td>
                      <td><strong>${t.punkte}</strong></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleSeason(headerElement) {
      const card = headerElement.parentElement;
      card.classList.toggle('open');
    }

    function switchTab(event, tabId) {
      event.stopPropagation();
      const parentContent = event.target.closest('.season-content');
      
      parentContent.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      parentContent.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    renderSeasons(seasonsData);
  </script>
</body>
</html>
