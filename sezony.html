<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sezony - CPL F1 League</title>
<style>
:root {
    --bg-color: #0d0d0d;
    --text-color: #ffffff;
    --card-bg: #181818;
    --border-color: #333333;
    --red-main: #ff3131;
}

* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body {
    background: var(--bg-color);
    color: var(--text-color);
    padding-top: 110px;
    padding-bottom: 60px;
    min-height: 100vh;
}

/* ORIGINAL CPL RED-BOX NAVIGATION */
nav {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 80px;
    background: linear-gradient(135deg, rgba(180, 40, 50, 0.70) 0%, rgba(100, 15, 25, 0.85) 100%);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 30px; z-index: 1000;
    border-bottom: 2px solid rgba(255, 49, 49, 0.4);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
}

nav ul { display: flex; list-style: none; gap: 15px; align-items: center; }
nav a { text-decoration: none; color: #fff; font-weight: 700; font-size: 15px; padding: 8px 14px; border-radius: 8px; transition: 0.3s; }
nav a:hover { background: rgba(255, 255, 255, 0.2); }

.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* SEASON CARD CONTAINER */
.season-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

.tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 15px;
}

.tab-btn {
    background: #222;
    color: #fff;
    border: 1px solid #444;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
}

.tab-btn:hover { border-color: var(--red-main); color: var(--red-main); }
.tab-btn.active { background: var(--red-main); color: #fff; border-color: var(--red-main); }

.table-wrapper { 
    overflow-x: auto; 
    min-height: 250px;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.data-table th, .data-table td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
}

.data-table th {
    background: rgba(255, 49, 49, 0.15);
    color: var(--red-main);
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 0.5px;
}

.data-table tr:hover { background: rgba(255, 255, 255, 0.03); }

.pos-badge { font-weight: bold; color: var(--red-main); }
.badge-dnf { color: #ff4444; font-weight: bold; }
.badge-dns { color: #777; }
.badge-win { color: #ffd700; font-weight: bold; }
.badge-p2 { color: #c0c0c0; font-weight: bold; }
.badge-p3 { color: #cd7f32; font-weight: bold; }

/* FOOTER SECTION */
footer {
    text-align: center;
    padding: 20px;
    color: #777;
    font-size: 13px;
    border-top: 1px solid var(--border-color);
    margin-top: 40px;
}
</style>
</head>
<body>

<nav>
    <a href="index.html"><img src="images/cpl_logo_lizard.png" height="48" alt="CPL Logo" onerror="this.style.display='none'"></a>
    <ul>
        <li><a href="kalendarz.html">Kalendarz</a></li>
        <li><a href="sezony.html">Sezony</a></li>
        <li><a href="kierowcy.html">Klasyfikacja</a></li>
        <li><a href="zespoly.html">Zespoły</a></li>
        <li><a href="news.html">News</a></li>
    </ul>
</nav>

<div class="container">
    <h1 style="color: var(--red-main); margin-bottom: 20px;">ARCHIWUM SEZONÓW</h1>

    <div class="season-card">
        <h2 style="margin-bottom: 15px;">Sezon Letni 2026</h2>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="btn-kierowcy" onclick="switchTab('kierowcy')">Kierowcy</button>
            <button class="tab-btn" id="btn-wyscigi" onclick="switchTab('wyscigi')">Wyścigi</button>
            <button class="tab-btn" id="btn-zespoly" onclick="switchTab('zespoly')">Zespoły</button>
        </div>

        <div id="tab-content" class="table-wrapper">Ładowanie danych z Google Sheets...</div>
    </div>
</div>

<footer>
    &copy; 2026 CPL F1 League. Wszystkie prawa zastrzeżone.
</footer>

<script>
const SHEET_ID = '1na_Zlv7uk9AGO3f76sqMvN5C5kT-EXnphJlTD6KKx0M';
const SHEET_GID = '482383691';

const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

let globalDrivers = [];

function parseCSV(text) {
    let lines = text.split(/\r\n|\n/);
    return lines.map(line => {
        let regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*)/g;
        let matches = [];
        let match;
        while ((match = regex.exec(line)) !== null) {
            let val = match[1].replace(/^"|"\$/g, '').trim();
            matches.push(val);
        }
        return matches;
    });
}

async function loadSeasonData() {
    try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const rawData = parseCSV(csvText);

        globalDrivers = [];

        rawData.forEach(row => {
            let pos = row[1];
            let driverName = row[3];

            if (pos && !isNaN(parseInt(pos)) && driverName && driverName !== '') {
                globalDrivers.push({
                    pos: pos,
                    number: row[2] || '',
                    name: driverName,
                    team: row[5] || 'Niezależny',  // Korrekte Spalte F für Teams
                    points: row[6] || '0',          // Korrekte Spalte G für Punkte
                    races: [
                        row[7] || '',  // AUS
                        row[8] || '',  // CAT
                        row[9] || '',  // WLO
                        row[10] || '', // AZE
                        row[11] || '', // MEK
                        row[12] || '', // HIS
                        row[13] || ''  // BRA
                    ]
                });
            }
        });

        if (globalDrivers.length === 0) {
            document.getElementById('tab-content').innerHTML = `<p style="color:orange; padding:20px;">Brak danych w wybranej tabeli.</p>`;
        } else {
            renderKierowcy();
        }

    } catch (err) {
        console.error(err);
        document.getElementById('tab-content').innerHTML = `<p style="color:red; padding:20px;">Błąd ładowania danych z Google Sheets.</p>`;
    }
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${tabName}`).classList.add('active');

    if (tabName === 'kierowcy') renderKierowcy();
    if (tabName === 'wyscigi') renderWyscigi();
    if (tabName === 'zespoly') renderZespoly();
}

function renderKierowcy() {
    let html = `<table class="data-table">
        <thead>
            <tr>
                <th>Poz</th>
                <th>#</th>
                <th>Kierowca</th>
                <th>Drużyna</th>
                <th>Punkty</th>
            </tr>
        </thead><tbody>`;

    globalDrivers.forEach(d => {
        html += `<tr>
            <td class="pos-badge">${d.pos}</td>
            <td>${d.number}</td>
            <td><strong>${d.name}</strong></td>
            <td>${d.team}</td>
            <td style="color: var(--red-main); font-weight:bold;">${d.points} PKT</td>
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tab-content').innerHTML = html;
}

function renderWyscigi() {
    let html = `<table class="data-table">
        <thead>
            <tr>
                <th>Kierowca</th>
                <th>AUS</th><th>CAT</th><th>WLO</th><th>AZE</th><th>MEK</th><th>HIS</th><th>BRA</th>
            </tr>
        </thead><tbody>`;

    globalDrivers.forEach(d => {
        html += `<tr>
            <td><strong>${d.name}</strong></td>
            ${d.races.map(r => `<td>\${formatResult(r)}</td>`).join('')}
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tab-content').innerHTML = html;
}

function renderZespoly() {
    let teams = {};
    globalDrivers.forEach(d => {
        let teamName = d.team || 'Niezależny';
        let pts = parseInt(d.points) || 0;
        if (!teams[teamName]) teams[teamName] = 0;
        teams[teamName] += pts;
    });

    let sortedTeams = Object.keys(teams)
        .map(t => ({ name: t, points: teams[t] }))
        .sort((a, b) => b.points - a.points);

    let html = `<table class="data-table">
        <thead>
            <tr>
                <th>Poz</th>
                <th>Zespół</th>
                <th>Suma Punktów</th>
            </tr>
        </thead><tbody>`;

    sortedTeams.forEach((t, idx) => {
        html += `<tr>
            <td class="pos-badge">${idx + 1}</td>
            <td><strong>${t.name}</strong></td>
            <td style="color: var(--red-main); font-weight:bold;">${t.points} PKT</td>
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tab-content').innerHTML = html;
}

function formatResult(val) {
    if (!val || val === '') return '-';
    if (val === '1') return `<span class="badge-win">P1</span>`;
    if (val === '2') return `<span class="badge-p2">P2</span>`;
    if (val === '3') return `<span class="badge-p3">P3</span>`;
    if (val === 'DNF' || val === 'DSC') return `<span class="badge-dnf">${val}</span>`;
    if (val === 'DNS') return `<span class="badge-dns">DNS</span>`;
    return val;
}

loadSeasonData();
</script>
</body>
</html>
