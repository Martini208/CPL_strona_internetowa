<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sezony - CPL F1 League</title>
<style>
:root {
    --bg-color: #0d0d0d;
    --text-color: #ffffff;
    --card-bg: #181818;
    --border-color: #333333;
    --red-main: #ff3131;
}

* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body {
    background: var(--bg-color);
    color: var(--text-color);
    padding-top: 110px;
    padding-bottom: 60px;
    min-height: 100vh;
}

/* ORIGINAL CPL RED-BOX NAVIGATION */
nav {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 80px;
    background: linear-gradient(135deg, rgba(180, 40, 50, 0.70) 0%, rgba(100, 15, 25, 0.85) 100%);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 30px; z-index: 1000;
    border-bottom: 2px solid rgba(255, 49, 49, 0.4);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
}

nav ul { display: flex; list-style: none; gap: 15px; align-items: center; }
nav a { text-decoration: none; color: #fff; font-weight: 700; font-size: 15px; padding: 8px 14px; border-radius: 8px; transition: 0.3s; }
nav a:hover { background: rgba(255, 255, 255, 0.2); }

.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* SEASON CARD CONTAINER */
.season-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

.season-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.season-select {
    background: #222;
    color: #fff;
    border: 1px solid var(--red-main);
    padding: 8px 15px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    outline: none;
}

.tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 15px;
}

.tab-btn {
    background: #222;
    color: #fff;
    border: 1px solid #444;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
}

.tab-btn:hover { border-color: var(--red-main); color: var(--red-main); }
.tab-btn.active { background: var(--red-main); color: #fff; border-color: var(--red-main); }

.table-wrapper { 
    overflow-x: auto; 
    min-height: 250px;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.data-table th, .data-table td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
}

.text-center {
    text-align: center !important;
}

.data-table th {
    background: rgba(255, 49, 49, 0.15);
    color: var(--red-main);
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 0.5px;
}

.data-table tr:hover { background: rgba(255, 255, 255, 0.03); }

.pos-badge { font-weight: bold; color: var(--red-main); }
.badge-dnf { color: #ff4444; font-weight: bold; }
.badge-dns { color: #777; }
.badge-win { color: #ffd700; font-weight: bold; }
.badge-p2 { color: #c0c0c0; font-weight: bold; }
.badge-p3 { color: #cd7f32; font-weight: bold; }

/* FOOTER SECTION */
footer {
    text-align: center;
    padding: 20px;
    color: #777;
    font-size: 13px;
    border-top: 1px solid var(--border-color);
    margin-top: 40px;
}
</style>
</head>
<body>

<nav>
    <a href="index.html"><img src="images/cpl_logo_lizard.png" height="48" alt="CPL Logo" onerror="this.style.display='none'"></a>
    <ul>
        <li><a href="kalendarz.html">Kalendarz</a></li>
        <li><a href="sezony.html">Sezony</a></li>
        <li><a href="kierowcy.html">Klasyfikacja</a></li>
        <li><a href="zespoly.html">Zespoły</a></li>
        <li><a href="news.html">News</a></li>
    </ul>
</nav>

<div class="container">
    <h1 style="color: var(--red-main); margin-bottom: 20px;">ARCHIWUM SEZONÓW</h1>

    <div class="season-card">
        <div class="season-header">
            <h2 id="season-title">Sezon Letni 2026</h2>
            <select id="season-picker" class="season-select" onchange="onSeasonChange()">
                <option value="482383691" data-name="Sezon Letni 2026" selected>Sezon Letni 2026</option>
                <!-- Trage hier die GID von Tabellenblatt "Sezon 19" ein falls sie abweicht -->
                <option value="SEZON_19_GID_HIER_EINTRAGEN" data-name="Sezon 19">Sezon 19</option>
            </select>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="btn-kierowcy" onclick="switchTab('kierowcy')">Kierowcy</button>
            <button class="tab-btn" id="btn-wyscigi" onclick="switchTab('wyscigi')">Wyścigi</button>
            <button class="tab-btn" id="btn-zespoly" onclick="switchTab('zespoly')">Zespoły</button>
        </div>

        <div id="tab-content" class="table-wrapper">Ładowanie danych z Google Sheets...</div>
    </div>
</div>

<footer>
    &copy; 2026 CPL F1 League. Wszystkie prawa zastrzeżone.
</footer>

<script>
const SHEET_ID = '1na_Zlv7uk9AGO3f76sqMvN5C5kT-EXnphJlTD6KKx0M';
let currentGid = '482383691';

let globalDrivers = [];
let globalTeams = [];
let raceHeaders = [];
let activeTab = 'kierowcy';

function parseCSVRow(row) {
    let cells = [];
    let insideQuote = false;
    let currentCell = '';
    
    for (let i = 0; i < row.length; i++) {
        let char = row[i];
        if (char === '"') {
            insideQuote = !insideQuote;
        } else if (char === ',' && !insideQuote) {
            cells.push(currentCell.trim().replace(/^"|"$/g, ''));
            currentCell = '';
        } else {
            currentCell += char;
        }
    }
    cells.push(currentCell.trim().replace(/^"|"$/g, ''));
    return cells;
}

function onSeasonChange() {
    let select = document.getElementById('season-picker');
    currentGid = select.value;
    let selectedName = select.options[select.selectedIndex].getAttribute('data-name');
    document.getElementById('season-title').innerText = selectedName;
    loadSeasonData();
}

async function loadSeasonData() {
    document.getElementById('tab-content').innerHTML = `Ładowanie danych...`;
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${currentGid}`;

    try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const lines = csvText.split(/\r\n|\n/);
        const rawData = lines.map(parseCSVRow);

        globalDrivers = [];
        globalTeams = [];
        raceHeaders = [];

        // 1. Suche nach Kopfzeile für Fahrer (Pozycja / Poz / Kierowca)
        let headerIndex = rawData.findIndex(r => r.includes('Pozycja') || r.includes('Poz') || r.includes('Kierowca'));
        if (headerIndex === -1) headerIndex = 11;

        let headers = rawData[headerIndex];

        let colPos = headers.indexOf('Pozycja') !== -1 ? headers.indexOf('Pozycja') : headers.indexOf('Poz');
        let colNum = headers.indexOf('Numer');
        let colDriver = headers.indexOf('Kierowca');
        let colTeam = headers.indexOf('Drużyna') !== -1 ? headers.indexOf('Drużyna') : headers.indexOf('Team');
        let colPts = headers.indexOf('PUNKTY') !== -1 ? headers.indexOf('PUNKTY') : headers.indexOf('Punkty');

        if (colPos === -1) colPos = 1;
        if (colDriver === -1) colDriver = 3;
        if (colPts === -1) colPts = 6;

        // Streckenabkürzungen aus der Zeile über den Fahrern auslesen (z.B. AUS, CAT, ITA, JAP...)
        let raceHeaderIndex = headerIndex > 0 ? headerIndex - 1 : -1;
        if (raceHeaderIndex !== -1 && rawData[raceHeaderIndex]) {
            let hRow = rawData[raceHeaderIndex];
            for (let c = colPts + 1; c < hRow.length; c++) {
                if (hRow[c] && hRow[c] !== '' && hRow[c] !== 'PUNKTY' && hRow[c] !== 'Delta') {
                    raceHeaders.push(hRow[c]);
                }
            }
        }
        
        // Standard-Rennen falls keine Kopfzeile gefunden wurde
        if (raceHeaders.length === 0) {
            raceHeaders = ['AUS', 'CAT', 'WLO', 'AZE', 'MEK', 'HIS', 'BRA'];
        }

        // 2. Fahrerdaten parsen
        for (let i = headerIndex + 1; i < rawData.length; i++) {
            let row = rawData[i];
            if (!row || row.length < 4) continue;

            let pos = row[colPos];
            let driverName = row[colDriver];

            if (pos && !isNaN(parseInt(pos)) && driverName && driverName !== '' && driverName !== '0') {
                let driverRaces = [];
                for (let r = 0; r < raceHeaders.length; r++) {
                    driverRaces.push(row[colPts + 1 + r] || '');
                }

                globalDrivers.push({
                    pos: pos,
                    number: colNum !== -1 ? (row[colNum] || '') : '',
                    name: driverName,
                    team: colTeam !== -1 ? (row[colTeam] || 'Niezależny') : 'Niezależny',
                    points: row[colPts] || '0',
                    races: driverRaces
                });
            }
        }

        // 3. Untere Team-Tabelle parsen (speziell für Sezon 19)
        let teamHeaderIndex = rawData.findIndex((r, idx) => idx > headerIndex && (r.includes('Team') || r.includes('Kierowca')) && r.includes('Punkty'));
        if (teamHeaderIndex !== -1) {
            let tHeaders = rawData[teamHeaderIndex];
            let tPosCol = tHeaders.indexOf('Poz') !== -1 ? tHeaders.indexOf('Poz') : 2;
            let tDriverCol = tHeaders.indexOf('Kierowca') !== -1 ? tHeaders.indexOf('Kierowca') : 3;
            let tTeamCol = tHeaders.indexOf('Team') !== -1 ? tHeaders.indexOf('Team') : 4;
            let tPtsCol = tHeaders.indexOf('Punkty') !== -1 ? tHeaders.indexOf('Punkty') : 5;

            for (let i = teamHeaderIndex + 1; i < rawData.length; i++) {
                let r = rawData[i];
                if (r[tPosCol] && !isNaN(parseInt(r[tPosCol]))) {
                    globalTeams.push({
                        pos: r[tPosCol],
                        drivers: r[tDriverCol] || '',
                        name: r[tTeamCol] || 'Niezależny',
                        points: parseInt(r[tPtsCol]) || 0
                    });
                }
            }
        }

        switchTab(activeTab);

    } catch (err) {
        console.error(err);
        document.getElementById('tab-content').innerHTML = `<p style="color:red; padding:20px;">Błąd ładowania danych z Google Sheets.</p>`;
    }
}

function switchTab(tabName) {
    activeTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${tabName}`).classList.add('active');

    if (tabName === 'kierowcy') renderKierowcy();
    if (tabName === 'wyscigi') renderWyscigi();
    if (tabName === 'zespoly') renderZespoly();
}

function renderKierowcy() {
    let html = `<table class="data-table">
        <thead>
            <tr>
                <th class="text-center">Poz</th>
                <th class="text-center">#</th>
                <th>Kierowca</th>
                <th>Drużyna</th>
                <th class="text-center">Punkty</th>
            </tr>
        </thead><tbody>`;

    globalDrivers.forEach(d => {
        html += `<tr>
            <td class="pos-badge text-center">${d.pos}</td>
            <td class="text-center">${d.number || '-'}</td>
            <td><strong>${d.name}</strong></td>
            <td>${d.team}</td>
            <td class="text-center" style="color: var(--red-main); font-weight:bold;">${d.points} PKT</td>
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tab-content').innerHTML = html;
}

function renderWyscigi() {
    let html = `<table class="data-table">
        <thead>
            <tr>
                <th>Kierowca</th>
                ${raceHeaders.map(h => `<th class="text-center">${h}</th>`).join('')}
            </tr>
        </thead><tbody>`;

    globalDrivers.forEach(d => {
        html += `<tr>
            <td><strong>${d.name}</strong></td>
            ${d.races.map(r => `<td class="text-center">${formatResult(r)}</td>`).join('')}
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tab-content').innerHTML = html;
}

function renderZespoly() {
    let sortedTeams = [];

    if (globalTeams.length > 0) {
        // Falls die Tabelle eine eigene Team-Sektion hatte (z.B. Sezon 19)
        sortedTeams = globalTeams;
    } else {
        // Berechne Punkte dynamisch aus den Fahrern (z.B. Sezon Letni 2026)
        let teams = {};
        globalDrivers.forEach(d => {
            let teamName = d.team || 'Niezależny';
            let pts = parseInt(d.points) || 0;
            if (!teams[teamName]) teams[teamName] = 0;
            teams[teamName] += pts;
        });

        sortedTeams = Object.keys(teams)
            .map(t => ({ name: t, points: teams[t] }))
            .sort((a, b) => b.points - a.points);
    }

    let html = `<table class="data-table">
        <thead>
            <tr>
                <th class="text-center">Poz</th>
                <th>Zespół</th>
                <th class="text-center">Suma Punktów</th>
            </tr>
        </thead><tbody>`;

    sortedTeams.forEach((t, idx) => {
        html += `<tr>
            <td class="pos-badge text-center">${t.pos || (idx + 1)}</td>
            <td><strong>${t.name}</strong> ${t.drivers ? `<br><small style="color:#888;">${t.drivers}</small>` : ''}</td>
            <td class="text-center" style="color: var(--red-main); font-weight:bold;">${t.points} PKT</td>
        </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tab-content').innerHTML = html;
}

function formatResult(val) {
    if (!val || val === '') return '-';
    if (val === '1') return `<span class="badge-win">P1</span>`;
    if (val === '2') return `<span class="badge-p2">P2</span>`;
    if (val === '3') return `<span class="badge-p3">P3</span>`;
    if (val === 'DNF' || val === 'DSC') return `<span class="badge-dnf">${val}</span>`;
    if (val === 'DNS') return `<span class="badge-dns">DNS</span>`;
    return val;
}

loadSeasonData();
</script>
</body>
</html>
