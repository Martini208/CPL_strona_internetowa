function hydrateTeams(list) {
    return list.map(t => {
        let wins = 0;
        let podiums = 0;
        (t.races || []).forEach(row => {
            const stats = countPodiumsAndWins(row);
            wins += stats.wins;
            podiums += stats.podiums;
        });
        return {
            key: normalizeTeamKey(t.name),
            name: t.name,
            points: t.points,
            podiums,
            wins,
            drivers: t.drivers
        };
    }).sort((a, b) => b.points - a.points);
}

function parseCSVRow(row) {
    const cells = [];
    let insideQuote = false;
    let currentCell = '';

    for (let i = 0; i < row.length; i++) {
        const char = row[i];
        if (char === '"') {
            insideQuote = !insideQuote;
        } else if (char === ',' && !insideQuote) {
            cells.push(currentCell.trim().replace(/^"|"$/g, ''));
            currentCell = '';
        } else {
            currentCell += char;
        }
    }
    cells.push(currentCell.trim().replace(/^"|"$/g, ''));
    return cells;
}

function parseNumber(val) {
    if (val === undefined || val === null) return 0;
    const cleaned = String(val).replace(',', '.').replace(/[^\d.-]/g, '');
    const num = parseFloat(cleaned);
    return isNaN(num) ? 0 : num;
}

function normalizeTeamKey(name) {
    const n = (name || '').toLowerCase();
    if (n.includes('mclaren')) return 'mclaren';
    if (n.includes('red bull') || n.includes('oracle')) return 'red bull';
    if (n.includes('williams')) return 'williams';
    if (n.includes('ferrari')) return 'ferrari';
    if (n.includes('alpine')) return 'alpine';
    if (n.includes('mercedes')) return 'mercedes';
    if (n.includes('aston')) return 'aston martin';
    if (n.includes('haas')) return 'haas';
    if (n.includes('racing bulls') || n.includes('vcarb') || n.includes('visa cash app')) return 'racing bulls';
    if (n.includes('audi')) return 'audi';
    if (n.includes('cadillac')) return 'cadillac';
    return n.trim();
}

function getTeamAssets(teamName) {
    const key = normalizeTeamKey(teamName);
    return TEAM_IMAGES[key] || {
        gradient: 'linear-gradient(135deg, #c81e2b 0%, #680d14 100%)',
        logo: 'images/cpl_logo_lizard.png',
        car: ''
    };
}

function countPodiumsAndWins(raceCells) {
    let wins = 0;
    let podiums = 0;

    raceCells.forEach(cell => {
        const val = String(cell || '').trim().toUpperCase();
        if (!val || val === '-' || val === '0' || val === 'DNS' || val === 'DNF' || val === 'DSC' || val === 'DSQ' || val === 'BAN') {
            return;
        }
        const match = val.match(/^P?([123])(?:\b|$)/);
        if (match) {
            const pos = parseInt(match[1], 10);
            if (pos === 1) wins += 1;
            if (pos >= 1 && pos <= 3) podiums += 1;
        }
    });

    return { wins, podiums };
}

function cleanDriverName(rawName) {
    return String(rawName || '')
        .replace(/\s*[–-]\s*[–-]\s*/g, ' – ')
        .replace(/\s+[–-]\s*$/g, '')
        .replace(/\s+/g, ' ')
        .trim();
}

function extractTeamsFromCSV(csvText) {
    if (!csvText || csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) return null;

    const lines = csvText.split(/\r\n|\n/);
    const rawData = lines.map(parseCSVRow);

    const teamTableHeaderIdx = rawData.findIndex(r => {
        const colC = (r[2] || '').trim().toLowerCase();
        const colD = (r[3] || '').trim().toLowerCase();
        const colG = (r[6] || '').trim().toLowerCase();
        return colC === 'pozycja' && colD === 'drużyna' && colG.includes('kierowc');
    });

    if (teamTableHeaderIdx === -1) return null;

    const teamsMap = new Map();
    let currentTeamKey = '';

    for (let i = teamTableHeaderIdx + 1; i < rawData.length; i++) {
        const row = rawData[i];
        if (!row || row.every(c => !c)) continue;

        const posCell = (row[2] || '').trim();
        const teamNameCell = (row[3] || '').trim();
        const driverNameCell = (row[6] || '').trim();
        const teamPtsCell = row[7] !== '' && row[7] !== undefined ? row[7] : row[28];
        const raceSlice = row.slice(8, 28);

        if (posCell.toLowerCase() === 'pozycja' && teamNameCell.toLowerCase() === 'drużyna') {
            break;
        }

        const { wins, podiums } = countPodiumsAndWins(raceSlice);

        if (teamNameCell && teamNameCell !== '#N/A' && teamNameCell.toLowerCase() !== 'drużyna') {
            currentTeamKey = normalizeTeamKey(teamNameCell);
            if (!teamsMap.has(currentTeamKey)) {
                teamsMap.set(currentTeamKey, {
                    key: currentTeamKey,
                    name: teamNameCell,
                    points: parseNumber(teamPtsCell),
                    podiums: 0,
                    wins: 0,
                    drivers: []
                });
            } else if (parseNumber(teamPtsCell) > 0) {
                teamsMap.get(currentTeamKey).points = parseNumber(teamPtsCell);
            }
        }

        if (currentTeamKey && teamsMap.has(currentTeamKey)) {
            const teamObj = teamsMap.get(currentTeamKey);
            teamObj.wins += wins;
            teamObj.podiums += podiums;

            if (
                driverNameCell &&
                driverNameCell !== '-' &&
                driverNameCell !== '#N/A' &&
                !driverNameCell.toLowerCase().includes('kierowc')
            ) {
                const displayDriver = cleanDriverName(driverNameCell);
                if (displayDriver && !teamObj.drivers.includes(displayDriver)) {
                    teamObj.drivers.push(displayDriver);
                }
            }
        }
    }

    if (teamsMap.size === 0) return null;
    return Array.from(teamsMap.values()).sort((a, b) => b.points - a.points);
}

async function fetchLeagueTeams(gid) {
    if (gid === '' || gid === null || gid === undefined) return null;
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&t=${Date.now()}`;
    try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return null;
        const csvText = await res.text();
        return extractTeamsFromCSV(csvText);
    } catch (err) {
        return null;
    }
}

async function loadLeaguesData() {
    let anyLiveLoaded = false;

    if (DIAMOND_LEAGUE_GID !== '') {
        const loadedDiamond = await fetchLeagueTeams(DIAMOND_LEAGUE_GID);
        if (loadedDiamond && loadedDiamond.length > 0) {
            diamondTeams = loadedDiamond;
            anyLiveLoaded = true;
        }
    }

    if (GOLD_LEAGUE_GID !== '') {
        const loadedGold = await fetchLeagueTeams(GOLD_LEAGUE_GID);
        if (loadedGold && loadedGold.length > 0) {
            goldTeams = loadedGold;
            anyLiveLoaded = true;
        }
    }

    dataSourceLabel = anyLiveLoaded ? 'Live Sheet' : 'Fallback';
    renderActiveDivision(document.getElementById('team-search').value);
}

function renderTeamCard(team) {
    const assets = getTeamAssets(team.name);
    const pillsHtml = team.drivers.length > 0
        ? team.drivers.map(d => `<span class="driver-pill">${d}</span>`).join('')
        : `<span class="driver-pill">Brak kierowców</span>`;

    const carHtml = assets.car
        ? `<img src="${assets.car}" alt="${team.name} F1 car" class="f1-car-img" onerror="this.style.display='none';">`
        : '';

    return `
        <article class="team-box" style="background: ${assets.gradient};">
            <div class="team-box-top">
                <div>
                    <h2 class="team-name">${team.name}</h2>
                    <div class="drivers-pills">
                        ${pillsHtml}
                    </div>
                </div>
                <div class="team-logo-circle">
                    <img
                        src="${assets.logo}"
                        alt="${team.name} logo"
                        class="team-logo-img"
                        onerror="this.onerror=null; this.src='images/cpl_logo_lizard.png';"
                    >
                </div>
            </div>

            <div class="team-box-bottom">
                <div class="team-stats-row">
                    <div class="stat-item">
                        <span class="stat-label">PUNKTY</span>
                        <span class="stat-value">${team.points}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">PODIA</span>
                        <span class="stat-value">${team.podiums}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">WYGRANE</span>
                        <span class="stat-value">${team.wins}</span>
                    </div>
                </div>

                <div class="team-car-visual">
                    ${carHtml}
                </div>
            </div>
        </article>
    `;
}

function renderActiveDivision(filterQuery = '') {
    const container = document.getElementById('division-container');
    const q = (filterQuery || '').trim().toLowerCase();

    const sourceList = activeDivision === 'gold' ? goldTeams : diamondTeams;
    const filtered = !q
        ? sourceList
        : sourceList.filter(team => {
            const teamMatch = team.name.toLowerCase().includes(q);
            const driverMatch = team.drivers.some(d => d.toLowerCase().includes(q));
            return teamMatch || driverMatch;
        });

    const isGold = activeDivision === 'gold';
    const sectionClass = isGold ? 'gold-section' : 'diamond-section';
    const chipClass = isGold ? 'gold-chip' : 'diamond-chip';
    const titleClass = isGold ? 'gold-title' : 'diamond-title';
    const chipText = isGold ? '🏆 Liga Złota' : '💎 Liga Diamentowa';
    const titleText = isGold ? 'Liga Złota' : 'Liga Diamentowa';
    const totalPts = filtered.reduce((sum, t) => sum + t.points, 0);

    container.innerHTML = `
        <section class="division-section ${sectionClass}">
            <div class="division-banner">
                <div class="division-title-wrap">
                    <span class="division-chip ${chipClass}">${chipText}</span>
                    <h2 class="division-title ${titleClass}">${titleText}</h2>
                </div>
                <div class="division-meta">${filtered.length} zespołów • ${totalPts} pkt łącznie • ${dataSourceLabel}</div>
            </div>
            <div class="teams-grid">
                ${filtered.length > 0
                    ? filtered.map(renderTeamCard).join('')
                    : `<div class="empty-state">Brak zespołów lub kierowców pasujących do wyszukiwania.</div>`
                }
            </div>
        </section>
    `;
}
