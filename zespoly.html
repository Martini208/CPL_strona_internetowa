<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zespoły - CPL F1 League</title>

<style>
:root {
    --bg-color: #0d0d0d;
    --text-color: #ffffff;
    --card-bg: #181818;
    --border-color: #333333;
    --nav-bg: rgba(217, 107, 108, 0.85);
}

body.light-mode {
    --bg-color: #f4f4f9;
    --text-color: #111111;
    --card-bg: #ffffff;
    --border-color: #e0e0e0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* Sticky Footer Layout */
body {
    background: var(--bg-color);
    color: var(--text-color);
    transition: background 0.3s ease, color 0.3s ease;
    padding-top: 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Navigation - Exakte Kopie der anderen Seiten */
nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 65px;
    background: var(--nav-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 35px;
    z-index: 1000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.f1-season-logo-img {
    height: 45px;
    width: auto;
    object-fit: contain;
    display: block;
}

.cpl-logo-img {
    height: 45px;
    width: auto;
    border-radius: 6px;
    object-fit: contain;
    display: block;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 15px;
    align-items: center;
    margin: 0;
    padding: 0;
}

nav a {
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 16px;
    padding: 6px 10px;
    border-radius: 6px;
    transition: opacity 0.2s ease;
    display: inline-block;
    background: transparent !important;
}

nav a:hover {
    opacity: 0.8;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.theme-toggle-btn {
    background: transparent;
    border: none;
    color: white;
    font-size: 20px;
    padding: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
}

.theme-toggle-btn:hover {
    transform: scale(1.1);
}

/* Page Container */
.zespoly-page-container {
    padding: 20px 5% 50px 5%;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    flex: 1 0 auto;
}

.page-title {
    text-align: center;
    margin-bottom: 30px;
}

.page-title h1 {
    font-size: 34px;
    color: #ff3131;
    text-transform: uppercase;
}

.page-title p {
    font-size: 15px;
    margin-top: 5px;
}

/* Suchbereich */
.search-container {
    display: flex;
    justify-content: center;
    margin-bottom: 35px;
}

.search-input {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.search-input:focus {
    border-color: #ff3131;
    box-shadow: 0 4px 20px rgba(255, 49, 49, 0.25);
}

/* Teams Grid Nebeneinander (2 Spalten auf Desktop) */
.teams-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

/* Team Card Design */
.f1-team-card {
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    padding: 22px 24px;
    min-height: 230px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease;
    border: 1px solid rgba(255,255,255,0.1);
}

.f1-team-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.7);
}

.team-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 2;
}

.team-info h2 {
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 12px;
    letter-spacing: -0.5px;
}

.team-drivers-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* Nur Namen ohne Bilder */
.driver-pill {
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    font-size: 13px;
    font-weight: bold;
    color: #ffffff;
}

    width: 42px;
    height: 42px;
    background
