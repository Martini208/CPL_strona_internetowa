<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CPL_strona_internetowa/</title>

  <style>
/* ---------------- GLOBAL APPLE STYLE ---------------- */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #fafafa;
  color: #111;
  margin: 0;
  padding: 0;
}

/* ---------------- TOP BAR ---------------- */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;

  background: rgba(196, 0, 0, 0.55);
  backdrop-filter: blur(30px) saturate(180%);
  padding: 16px 45px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.25);
  z-index: 1000;
}

.top-bar img {
  width: 110px;
  margin-right: 20px;
}

.top-bar .seasonpack {
  width: 150px;
  margin-left: 15px;
}

/* Navigation */
.nav {
  display: flex;
  gap: 20px;
}

.nav a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.nav a:hover {
  background: rgba(255,255,255,0.25);
}

/* LOGIN BUTTON RECHTS */
.login {
  margin-left: auto;
  padding-right: 80px;
}

.login a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.login a:hover {
  background: rgba(255,255,255,0.25);
}

/* ---------------- GRAUE BOX ---------------- */
.next-race-box {
  position: fixed;
  top: 90px;
  left: 0;
  width: 100%;
  background: #e5e5e5;
  padding: 25px 45px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  opacity: 0;
  transition: opacity 0.8s;
  z-index: 900;
}

.next-left {
  font-size: 22px;
  font-weight: 600;
  color: #333;
  display: flex;
  gap: 18px;
  align-items: center;
}

.vline {
  width: 3px;
  height: 35px;
  background: #333;
  border-radius: 2px;
}

.next-right {
  font-size: 22px;
  font-weight: 600;
  color: #333;
  padding-right: 80px;
}

/* ---------------- VIDEO BOX ---------------- */
.video-container {
  margin-top: 180px; /* Abstand unter der grauen Box */
  width: 100%;
  display: flex;
  justify-content: center;
}

.video-container iframe {
  width: 80%;
  height: 450px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}
  </style>
</head>

<body>

  <div class="top-bar">
    <img src="images/cpl_logo_lizard.png" alt="CPL Logo">
    <img src="images/EAS_F125_2026_SeasonPack_Horizontal_Black.png" class="seasonpack" alt="Season Pack">

    <div class="nav">
      <a href="#kalendarz">Kalendarz</a>
      <a href="#sezony">Sezony</a>
      <a href="#kierowcy">Kierowcy</a>
      <a href="#zespoly">Zespoły</a>
      <a href="#news">News</a>
      <a href="#onas">O nas</a>
    </div>

    <div class="login">
      <a href="#login">Zaloguj</a>
    </div>
  </div>

  <!-- 🔥 GRAUE BOX -->
  <div class="next-race-box" id="nextBox">
    <div class="next-left">
      <span>Następny Wyścig</span>
      <div class="vline"></div>
      <span>15. Sierpień</span>
      <div class="vline"></div>
      <span>Włochy</span>
    </div>

    <div class="next-right">
      Czas 20:00
    </div>
  </div>

  <!-- 🔥 VIDEO UNTER DER BOX -->
  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/WepEUEu1Hv0?autoplay=1&mute=1&loop=1&playlist=WepEUEu1Hv0&controls=0&modestbranding=1&rel=0"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

<script>
let box = document.getElementById("nextBox");

let showTimeout = setTimeout(() => {
  box.style.opacity = "1";
}, 10000);

window.addEventListener("scroll", () => {
  if (window.scrollY > 10) {
    box.style.opacity = "0";
  } else {
    clearTimeout(showTimeout);
    showTimeout = setTimeout(() => {
      box.style.opacity = "1";
    }, 10000);
  }
});
</script>

</body>
</html>
