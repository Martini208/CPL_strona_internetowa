<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CPL_strona_internetowa/</title>

  <style>
/* ---------------- GLOBAL APPLE STYLE ---------------- */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #fafafa;
  color: #111;
  margin: 0;
  padding: 0;
}

/* ---------------- TOP BAR ---------------- */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;

  background: rgba(196, 0, 0, 0.55);
  backdrop-filter: blur(30px) saturate(180%);
  padding: 16px 45px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.25);
  z-index: 1000;
}

.top-bar img {
  width: 110px;
  margin-right: 20px;
}

.top-bar .seasonpack {
  width: 150px;
  margin-left: 15px;
}

/* Navigation */
.nav {
  display: flex;
  gap: 20px;
}

.nav a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.nav a:hover {
  background: rgba(255,255,255,0.25);
}

/* LOGIN BUTTON RECHTS */
.login {
  margin-left: auto; /* Schiebt den Button ganz nach rechts */
}

.login a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.login a:hover {
  background: rgba(255,255,255,0.25);
}

/* Spacer */
.spacer {
  height: 140px;
}
  </style>
</head>

<body>

  <div class="top-bar">
    <img src="images/cpl_logo_lizard.png" alt="CPL Logo">
    <img src="images/EAS_F125_2026_SeasonPack_Horizontal_Black.png" class="seasonpack" alt="Season Pack">

    <div class="nav">
      <a href="#kalendarz">Kalendarz</a>
      <a href="#sezony">Sezony</a>
      <a href="#kierowcy">Kierowcy</a>
      <a href="#zespoly">Zespoły</a>
      <a href="#news">News</a>
      <a href="#onas">O nas</a>
    </div>

    <div class="login">
      <a href="#login">Zaloguj</a>
    </div>
  </div>

  <div class="spacer"></div>

</body>
</html>
