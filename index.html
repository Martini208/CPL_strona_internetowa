<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CPL_strona_internetowa/</title>

  <style>
/* ---------------- GLOBAL APPLE STYLE ---------------- */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #fafafa;
  color: #111;
  margin: 0;
  padding: 0;
}

/* ---------------- TOP BAR ---------------- */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;

  background: rgba(196, 0, 0, 0.55);
  backdrop-filter: blur(30px) saturate(180%);
  padding: 16px 45px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.25);
  z-index: 1000;
}

.top-bar img {
  width: 110px;
  margin-right: 20px;
}

.top-bar .seasonpack {
  width: 150px;
  margin-left: 15px;
}

/* Navigation */
.nav {
  display: flex;
  gap: 20px;
}

.nav a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.nav a:hover {
  background: rgba(255,255,255,0.25);
}

/* LOGIN BUTTON RECHTS */
.login {
  margin-left: auto;
  padding-right: 80px;
}

.login a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.login a:hover {
  background: rgba(255,255,255,0.25);
}

  <!-- GRAUE BOX -->
  <div class="next-race-box" id="nextBox">
    <div class="next-left">
      <span>Następny Wyścig</span>
      <div class="vline"></div>
      <span>15. Sierpień</span>
      <div class="vline"></div>
      <span>Włochy</span>
    </div>

    <div class="next-right">
      Czas 20:00
    </div>
  </div>


/* ---------------- VIDEO HERO (normaler Flow) ---------------- */
.hero-video {
  margin-top: 140px; /* unter der Top-Bar */
  width: 100%;
  height: 95vh;
  overflow: hidden;
}

.hero-video iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* ---------------- NEWS SECTION ---------------- */
.news-section {
  padding: 40px 45px;
  background: #fff;
}

/* NEWS-TITEL LINKS OBEN, ROT, APPLE STYLE */
.news-section h1 {
  font-size: 40px;
  font-weight: 700;
  margin-bottom: 30px;
  letter-spacing: -1px;
  color: #c40000;
}

.news-section p {
  font-size: 22px;
  line-height: 1.7;
  color: #444;
  max-width: 900px;
}
  </style>
</head>

<body>

  <div class="top-bar">
    <img src="images/cpl_logo_lizard.png" alt="CPL Logo">
    <img src="images/EAS_F125_2026_SeasonPack_Horizontal_Black.png" class="seasonpack" alt="Season Pack">

    <div class="nav">
      <a href="#kalendarz">Kalendarz</a>
      <a href="#sezony">Sezony</a>
      <a href="#kierowcy">Kierowcy</a>
      <a href="#zespoly">Zespoły</a>
      <a href="#news">News</a>
      <a href="#onas">O nas</a>
    </div>

    <div class="login">
      <a href="#login">Zaloguj</a>
    </div>
  </div>

  <!-- GRAUE BOX -->
  <div class="next-race-box" id="nextBox">
    <div class="next-left">
      <span>Następny Wyścig</span>
      <div class="vline"></div>
      <span>15. Sierpień</span>
      <div class="vline"></div>
      <span>Włochy</span>
    </div>

    <div class="next-right">
      Czas 20:00
    </div>
  </div>

  <!-- VIDEO HERO -->
  <div class="hero-video" id="heroVideo">
    <iframe 
      src="https://www.youtube.com/embed/WepEUEu1Hv0?autoplay=1&mute=1&loop=1&playlist=WepEUEu1Hv0&controls=0&modestbranding=1&rel=0&showinfo=0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <!-- NEWS SECTION -->
  <div class="news-section" id="news">
    <h1>News</h1>
    <p>Hier erscheinen später alle wichtigen CPL‑News: Fahrerwechsel, Rennberichte, Teamupdates, neue Saisondaten und vieles mehr.</p>
  </div>

<script>
/* ---------------- BOX NACH 10 SEKUNDEN ANZEIGEN ---------------- */
let box = document.getElementById("nextBox");

setTimeout(() => {
  box.style.opacity = "1";
}, 10000);
</script>

</body>
</html>
