<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CPL_strona_internetowa/</title>

  <style>
/* ---------------- GLOBAL APPLE STYLE ---------------- */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #fafafa;
  color: #111;
  margin: 0;
  padding: 0;
}

/* ---------------- TOP BAR ---------------- */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;

  background: rgba(196, 0, 0, 0.55);
  backdrop-filter: blur(30px) saturate(180%);
  padding: 16px 45px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.25);
  z-index: 1000;
}

.top-bar img {
  width: 110px;
  margin-right: 20px;
}

.top-bar .seasonpack {
  width: 150px;
  margin-left: 15px;
}

/* Navigation */
.nav {
  display: flex;
  gap: 20px;
}

.nav a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.nav a:hover {
  background: rgba(255,255,255,0.25);
}

/* LOGIN BUTTON RECHTS */
.login {
  margin-left: auto;
  padding-right: 80px;   /* größerer Abstand rechts */
}

.login a {
  color: #fff;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  text-decoration: none;
  font-size: 17px;
  transition: 0.25s;
}

.login a:hover {
  background: rgba(255,255,255,0.25);
}

/* ---------------- GRAUE BOX ---------------- */
.next-race-box {
  margin-top: 140px; /* unter der roten Leiste */
  width: 100%;
  background: #e5e5e5;
  padding: 25px 45px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

/* Linker Textblock */
.next-left {
  font-size: 22px;
  font-weight: 600;
  color: #333;
  display: flex;
  gap: 18px;
  align-items: center;
}

/* Kleiner Strich */
.next-left .line {
  width: 40px;
  height: 3px;
  background: #333;
  border-radius: 2px;
}

/* Rechter Textblock */
.next-right {
  font-size: 22px;
  font-weight: 600;
  color: #333;
  padding-right: 80px; /* Abstand rechts */
}
  </style>
</head>

<body>

  <div class="top-bar">
    <img src="images/cpl_logo_lizard.png" alt="CPL Logo">
    <img src="images/EAS_F125_2026_SeasonPack_Horizontal_Black.png" class="seasonpack" alt="Season Pack">

    <div class="nav">
      <a href="#kalendarz">Kalendarz</a>
      <a href="#sezony">Sezony</a>
      <a href="#kierowcy">Kierowcy</a>
      <a href="#zespoly">Zespoły</a>
      <a href="#news">News</a>
      <a href="#onas">O nas</a>
    </div>

    <div class="login">
      <a href="#login">Zaloguj</a>
    </div>
  </div>

  <!-- 🔥 GRAUE BOX UNTER DER ROTEN LEISTE -->
  <div class="next-race-box">
    <div class="next-left">
      <span>Następny Wyścig</span>
      <div class="line"></div>
      <span>15. Sierpień</span>
      <span>Włochy</span>
    </div>

    <div class="next-right">
      Czas 20:00
    </div>
  </div>

</body>
</html>
